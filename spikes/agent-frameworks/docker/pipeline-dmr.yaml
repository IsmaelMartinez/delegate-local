# Spike arm A4d: drafter -> critic -> reviser on Docker Model Runner with
# reasoning disabled, chained with force_handoff (deterministic one-pass order).
agents:
  root:
    model: dmr_prose
    description: Drafts the reply
    instruction: |
      Follow the user's message exactly. Output only the requested reply text.
    force_handoff: critic

  critic:
    model: dmr_prose
    description: Checks the draft against the rules in the user's message
    instruction: |
      You are reviewing the previous assistant's draft against the rules and
      facts in the user's original message. Do not rewrite the draft. List each
      concrete violation on its own line, quoting the offending words, using
      these labels: ECHO (a fact line copied as written), ASKED-NOT-STATED (a
      supplied fact turned into a question), INVENTED (a value or action not in
      the facts), DROPPED (an anchor from the facts missing), MERGED (distinct
      asks joined), LIST (numbered list where prose was asked, or vice versa),
      LENGTH (over the word limit in the ask), OPENER (the opener or handle not
      first, or thanks invented), TAIL (a closing restatement or participial
      clause). If there is no violation, output exactly: NO VIOLATIONS.
    force_handoff: reviser

  reviser:
    model: dmr_prose
    description: Produces the final reply
    instruction: |
      Rewrite the draft so that every violation the critic listed is fixed and
      every rule in the user's original message holds, using only the facts
      given there. If the critic said NO VIOLATIONS, output the draft unchanged.
      Output only the final reply text, nothing else.

models:
  dmr_prose:
    provider: dmr
    model: qwen3.6:35b-a3b-q8_0
    temperature: 0
    max_tokens: 4096
    provider_opts:
      context_size: 16384
      runtime_flags: ["--reasoning-budget", "0"]
