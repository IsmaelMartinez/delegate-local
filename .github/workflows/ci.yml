name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR supersedes the run in flight; each push to main gets a
# group of its own (its sha), so none is cancelled or held behind another.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need history vs the base ref so the trigger-eval step can decide
          # whether SKILL.md or evals/ actually changed. fetch-depth: 0 grabs
          # full history; the alternative (--depth=1 + git fetch base) is
          # fiddlier on push events where there's no PR base.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify required tools
        run: |
          jq --version
          perl --version | head -2
          bash --version | head -1
          shellcheck --version | head -2

      - name: Validate frontmatter
        run: bash scripts/validate-frontmatter.sh SKILL.md

      - name: Validate content
        run: bash scripts/validate-skill-content.sh SKILL.md

      - name: Eval-set shape
        run: bash scripts/eval-skill-triggers.sh

      - name: Shellcheck (errors only)
        # .shellcheckrc sets the shell and source path.
        run: find scripts tests .claude/hooks -name '*.sh' -print0 | xargs -0 shellcheck -S error

      - name: Trigger eval (Anthropic API)
        # Blocking: when it runs and cannot produce a score, the job fails.
        timeout-minutes: 5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The PR base (pull_request) or the previous tip (push). On the first
          # push to a branch github.event.before is all zeros, and the gate
          # runs rather than skipping on an unknown base.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            if git diff --quiet "$BASE_SHA" -- SKILL.md evals/; then
              echo "SKILL.md and evals/ unchanged vs $BASE_SHA; trigger eval not needed"
              exit 0
            fi
          fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice title=Trigger eval skipped::SKILL.md or evals/ changed but the ANTHROPIC_API_KEY repo secret is not set; run 'bash scripts/eval-skill-triggers.sh --local' before merging"
            exit 0
          fi
          bash scripts/eval-skill-triggers.sh --api

  tests:
    name: tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pytest
        # test-apply-and-test.sh and test-fix-with-test-fixtures.sh assert on
        # real pytest runs, not mocks.
        run: python3 -m pip install --quiet pytest

      - name: Run this shard's test files
        # Every tests/test-*.sh plus tests/run-tests.sh, largest first and dealt
        # round-robin across the shards, so a new test file runs without
        # editing this workflow. A failing file does not stop the others.
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          i=0; failed=""
          for f in $(ls -S tests/test-*.sh tests/run-tests.sh); do
            i=$((i + 1))
            [ $(( (i - 1) % 2 + 1 )) -eq "$SHARD" ] || continue
            echo "::group::$f"
            start=$SECONDS
            if bash "$f"; then status=ok; else status=FAIL; failed="$failed $f"; fi
            echo "::endgroup::"
            echo "$status $f ($((SECONDS - start))s)"
          done
          if [ -n "$failed" ]; then
            echo "::error::failing test files:$failed"
            exit 1
          fi

  validate:
    # The required status check on main; it passes only when every gate and
    # every test shard passed.
    name: validate skill
    if: always()
    needs: [gates, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require gates and tests
        env:
          GATES: ${{ needs.gates.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "gates=$GATES tests=$TESTS"
          [ "$GATES" = success ] && [ "$TESTS" = success ]
