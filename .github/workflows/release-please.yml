name: Release Please

on:
  push:
    branches:
      - main
  # Lets a stale release PR be regenerated without waiting for an unrelated
  # push to main. Needed on 2026-08-18, when v0.21.0 through v0.23.0 had gone
  # out as drafts and left no tags for release-please to anchor on.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A release PR opened with GITHUB_TOKEN is authored by
      # github-actions[bot], and its ci runs are held as action_required until
      # someone approves them (#549). A GitHub App token makes the App the
      # author, so ci runs unattended. Skipped until the RELEASE_APP_ID
      # variable exists, and the token below then falls back to GITHUB_TOKEN.
      # `client-id` also accepts the numeric App ID: the action reads
      # client-id || app-id into the same JWT issuer (app-id is deprecated).
      - name: Create GitHub App token
        id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
