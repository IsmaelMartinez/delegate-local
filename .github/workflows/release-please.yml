name: Release Please

on:
  push:
    branches:
      - main
  # Lets a stale release PR be regenerated without waiting for an unrelated
  # push to main. Needed on 2026-08-18, when v0.21.0 through v0.23.0 had gone
  # out as drafts and left no tags for release-please to anchor on.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
