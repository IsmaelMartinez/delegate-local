name: monthly-audit-reminder

# Notification-only workflow for recurring model-inventory maintenance.
#
# `scripts/audit-models.sh` reads the local model store and whichever providers
# are running, so it can't run on a GitHub-hosted runner. This workflow opens
# a tracking issue on the 1st of each month reminding the maintainer to run the
# audit locally. Idempotent: if an open issue with the same title exists, the
# job exits without opening a duplicate. `workflow_dispatch` is the manual
# escape hatch for re-running the reminder outside the monthly cadence.

on:
  schedule:
    # 09:00 UTC on the 1st of every month.
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  open-reminder:
    name: open monthly audit reminder
    runs-on: ubuntu-latest
    steps:
      - name: Open reminder issue if none open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_TITLE: 'Monthly: audit installed models'
        run: |
          set -euo pipefail

          existing=$(gh issue list \
            --repo "$GH_REPO" \
            --state open \
            --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title \
            --jq "[.[] | select(.title == \"$ISSUE_TITLE\")] | .[0].number // empty")

          if [ -n "$existing" ]; then
            echo "Open reminder issue already exists (#$existing) — skipping."
            exit 0
          fi

          # Build the issue body with printf so we don't fight heredoc-vs-
          # YAML-indent rules (a plain heredoc terminator must sit at column 0,
          # which clashes with the YAML script block's leading indent).
          body=$(printf '%s\n' \
            'Monthly reminder to run `scripts/audit-models.sh` locally and review the llmfit-driven upgrade suggestions. This workflow is notification-only because the audit reads the local model store and the running providers, which a GitHub-hosted runner does not have.' \
            '' \
            '### Checklist' \
            '' \
            '- [ ] Run `bash scripts/audit-models.sh` locally.' \
            '- [ ] Review llmfit-driven upgrade suggestions (3+ point delta threshold).' \
            '- [ ] If a model beats the installed leader, install it and open a PR updating the tier preference list in `scripts/pick-model.sh`, with the matching assertion in `tests/run-tests.sh`.' \
            '- [ ] Close this issue once the audit is complete (next month'"'"'s run will open a fresh one).')

          gh issue create \
            --repo "$GH_REPO" \
            --title "$ISSUE_TITLE" \
            --body "$body" \
            --label enhancement
